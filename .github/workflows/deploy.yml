# 每次 push：檢查（lint、型別、建置）→ 只有 main 分支才部署到 Cloudflare
name: 檢查與部署

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch: # 允許在 GitHub 網頁手動觸發

# 預設只給讀取權限，需要更多再個別開
permissions:
  contents: read

jobs:
  check:
    name: 檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm # 快取下載過的套件，加快安裝
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: 部署
    needs: check # 檢查沒過就不會執行
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 同時只跑一個部署，新的進來時取消還在排隊的舊部署
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
